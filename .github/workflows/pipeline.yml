name: pipeline-ulasan
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jalan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-pipeline.txt
      - run: python -m pipeline.jalankan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data ringkasan.json log_pipeline.json
          git commit -m "Pembaruan data otomatis" || echo "tidak ada perubahan"
          git push